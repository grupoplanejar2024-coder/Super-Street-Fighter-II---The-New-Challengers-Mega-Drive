<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Street Fighter II - Kubo Touch</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121212; color: #fff; font-family: Arial, sans-serif; }
        header { text-align: center; padding: 15px; background: #1e1e1e; }
        .badge { background: #e74c3c; color: #fff; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        #game-card { max-width: 500px; margin: 20px auto; background: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        /* Área da capa em 3D */
        .cover-scene {
            width: 100%;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at 50% 35%, #26201b 0%, #121212 75%);
            perspective: 900px;
            touch-action: none;
        }

        .cover-3d {
            --rx: 0deg;
            --ry: 0deg;
            --gx: 50%;
            --gy: 50%;
            position: relative;
            height: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 10px;
            transform-style: preserve-3d;
            transform: rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        .cover-scene:hover .cover-3d,
        .cover-scene.is-interacting .cover-3d {
            transition: transform 0.08s linear, box-shadow 0.2s ease;
            box-shadow:
                0 26px 45px rgba(0, 0, 0, 0.85),
                0 0 24px rgba(231, 76, 60, 0.22),
                0 0 0 1px rgba(255, 255, 255, 0.22);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            transform: translateZ(12px);
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Borda de espessura / relevo do estojo */
        .cover-3d::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 10px;
            border: 2px solid rgba(255, 210, 140, 0.18);
            transform: translateZ(6px);
            pointer-events: none;
        }

        /* Reflexo de luz dinâmico (gloss) */
        .cover-glare {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: radial-gradient(
                circle at var(--gx) var(--gy),
                rgba(255, 255, 255, 0.32) 0%,
                rgba(255, 200, 120, 0.10) 28%,
                rgba(255, 255, 255, 0) 62%
            );
            opacity: 0;
            transition: opacity 0.25s ease;
            transform: translateZ(18px);
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .cover-scene:hover .cover-glare,
        .cover-scene.is-interacting .cover-glare {
            opacity: 1;
        }

        .content { padding: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #e74c3c; }
        .meta-info { display: flex; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .description { font-size: 14px; line-height: 1.5; color: #ddd; margin-bottom: 15px; }
        .details { font-size: 13px; color: #bbb; margin-bottom: 20px; }
        .details ul { padding-left: 20px; margin: 0; }
        .btn-play { display: block; width: 100%; padding: 12px; background: #c0392b; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; text-align: center; text-decoration: none; cursor: pointer; box-sizing: border-box; }
        .btn-play:hover { background: #a93226; }
        #game-container { display: none; width: 100%; height: 100vh; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header id="top-header">
        <span class="badge">KUBO TOUCH</span>
    </header>

    <div id="game-card">
        <div class="cover-scene" id="cover-scene">
            <div class="cover-3d" id="cover-3d">
                <!-- Altera o src para o nome exato da imagem no teu repositório -->
                <img class="cover-img" src="super-street-fighter-2.jpeg" alt="Capa Super Street Fighter II">
                <div class="cover-glare"></div>
            </div>
        </div>
        <div class="content">
            <h1>Super Street Fighter II</h1>

            <div class="meta-info">
                <span>🎮 1-2 Jogadores</span>
                <span>📅 1993 / 1994</span>
                <span>🕹️ SEGA</span>
            </div>

            <p class="description">
                Entre no torneio mundial com o elenco clássico e quatro novos lutadores — Cammy, T. Hawk, Fei Long e Dee Jay — em combates intensos e golpes especiais icónicos.
            </p>

            <div class="details">
                <ul>
                    <li>Gênero: Luta</li>
                </ul>
            </div>

            <button class="btn-play" onclick="iniciarJogo()">JOGAR AGORA</button>
        </div>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        (function initCover3D() {
            const scene = document.getElementById('cover-scene');
            const card = document.getElementById('cover-3d');
            if (!scene || !card) return;

            const maxTilt = 16; // graus de inclinação

            function updateTilt(clientX, clientY) {
                const rect = scene.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));

                const rotY = ((x - 0.5) * 2 * maxTilt).toFixed(2);
                const rotX = ((0.5 - y) * 2 * maxTilt).toFixed(2);

                card.style.setProperty('--ry', `${rotY}deg`);
                card.style.setProperty('--rx', `${rotX}deg`);
                card.style.setProperty('--gx', `${(x * 100).toFixed(1)}%`);
                card.style.setProperty('--gy', `${(y * 100).toFixed(1)}%`);
            }

            function resetTilt() {
                scene.classList.remove('is-interacting');
                card.style.setProperty('--ry', '0deg');
                card.style.setProperty('--rx', '0deg');
                card.style.setProperty('--gx', '50%');
                card.style.setProperty('--gy', '50%');
            }

            scene.addEventListener('pointerenter', (e) => {
                scene.classList.add('is-interacting');
                updateTilt(e.clientX, e.clientY);
            });

            scene.addEventListener('pointermove', (e) => {
                scene.classList.add('is-interacting');
                updateTilt(e.clientX, e.clientY);
            });

            scene.addEventListener('pointerleave', resetTilt);
            scene.addEventListener('pointercancel', resetTilt);
        })();

        function iniciarJogo() {
            document.getElementById('top-header').style.display = 'none';
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            window.EJS_player = '#game';
            window.EJS_core = 'segaMD';
            window.EJS_gameName = 'Super Street Fighter II';
            // Altera para o nome exato do ficheiro da ROM no teu repositório
            window.EJS_gameUrl = 'super-street-fighter-2.bin';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
